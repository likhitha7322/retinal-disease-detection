[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retina_ai"
version = "2.1.0"
description = "Clinical Decision-Support Framework for Retinal Disease Screening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=0.9.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.7",
    "pytorch-grad-cam>=0.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["retina_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "node_modules", "retinavision-ai", "dist", "build", ".git"]


